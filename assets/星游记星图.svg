<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="星游记星际航线图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a17"/>
      <stop offset="0.55" stop-color="#080d20"/>
      <stop offset="1" stop-color="#120a1e"/>
    </linearGradient>
    <radialGradient id="earth" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#8fe3ff"/>
      <stop offset="0.55" stop-color="#2f8fd6"/>
      <stop offset="1" stop-color="#123a63"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6b0"/>
      <stop offset="0.6" stop-color="#ffb03a"/>
      <stop offset="1" stop-color="#ff7a00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bh" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.42" stop-color="#000000"/>
      <stop offset="0.6" stop-color="#1a0b2e"/>
      <stop offset="0.78" stop-color="#7b2cbf" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff9e00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="0.2" stop-color="#ffb703"/>
      <stop offset="0.4" stop-color="#8ac926"/>
      <stop offset="0.6" stop-color="#00c2d1"/>
      <stop offset="0.8" stop-color="#4361ee"/>
      <stop offset="1" stop-color="#b5179e"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .t  { font-family: 'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei','PingFang SC','Source Han Sans SC',sans-serif; }
    .title { font-size: 36px; font-weight: 700; fill: #ffe9a8; letter-spacing: 3px; }
    .sub   { font-size: 15px; fill: #8fa3c8; letter-spacing: 1px; }
    .zone  { font-size: 14px; fill: #6f86ad; letter-spacing: 5px; }
    .node  { font-size: 17px; font-weight: 600; fill: #eaf2ff; }
    .sub2  { font-size: 12.5px; fill: #93a7c9; }
    .tiny  { font-size: 11px; fill: #6f86ad; }
    .warn  { font-size: 12px; fill: #ff8fa3; }
    .leg   { font-size: 13px; fill: #b9c8e2; }
    .legt  { font-size: 14px; font-weight: 700; fill: #ffe9a8; letter-spacing: 2px; }
    .chip  { font-size: 14px; font-weight: 600; fill: #dce8ff; }
    .chip2 { font-size: 10.5px; fill: #7f93b6; }
  </style>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#dfe9ff">
    <circle cx="70" cy="180" r="1.2" opacity=".7"/><circle cx="120" cy="90" r="1" opacity=".5"/>
    <circle cx="210" cy="145" r="1.4" opacity=".8"/><circle cx="300" cy="95" r="1" opacity=".45"/>
    <circle cx="380" cy="170" r="1.2" opacity=".65"/><circle cx="455" cy="105" r="1.6" opacity=".8"/>
    <circle cx="530" cy="150" r="1" opacity=".5"/><circle cx="610" cy="90" r="1.3" opacity=".7"/>
    <circle cx="690" cy="175" r="1.1" opacity=".55"/><circle cx="760" cy="120" r="1.5" opacity=".75"/>
    <circle cx="840" cy="85" r="1" opacity=".5"/><circle cx="910" cy="150" r="1.3" opacity=".65"/>
    <circle cx="990" cy="110" r="1.1" opacity=".55"/><circle cx="1075" cy="170" r="1.4" opacity=".7"/>
    <circle cx="1150" cy="95" r="1" opacity=".45"/><circle cx="1230" cy="150" r="1.6" opacity=".8"/>
    <circle cx="1310" cy="105" r="1.2" opacity=".6"/><circle cx="1390" cy="165" r="1" opacity=".5"/>
    <circle cx="1470" cy="100" r="1.4" opacity=".7"/><circle cx="1540" cy="185" r="1.1" opacity=".55"/>
    <circle cx="80" cy="300" r="1.1" opacity=".5"/><circle cx="170" cy="250" r="1.3" opacity=".6"/>
    <circle cx="260" cy="210" r="1" opacity=".45"/><circle cx="340" cy="270" r="1.2" opacity=".55"/>
    <circle cx="430" cy="225" r="1" opacity=".5"/><circle cx="520" cy="280" r="1.4" opacity=".65"/>
    <circle cx="620" cy="235" r="1.1" opacity=".5"/><circle cx="720" cy="290" r="1" opacity=".45"/>
    <circle cx="810" cy="245" r="1.3" opacity=".6"/><circle cx="900" cy="310" r="1.1" opacity=".5"/>
    <circle cx="1000" cy="260" r="1.4" opacity=".65"/><circle cx="1090" cy="320" r="1" opacity=".45"/>
    <circle cx="1180" cy="270" r="1.2" opacity=".55"/><circle cx="1270" cy="330" r="1.1" opacity=".5"/>
    <circle cx="1360" cy="280" r="1.3" opacity=".6"/><circle cx="1450" cy="335" r="1" opacity=".45"/>
    <circle cx="1530" cy="285" r="1.2" opacity=".55"/>
    <circle cx="95" cy="640" r="1.1" opacity=".45"/><circle cx="185" cy="710" r="1.3" opacity=".55"/>
    <circle cx="275" cy="655" r="1" opacity=".4"/><circle cx="365" cy="725" r="1.2" opacity=".5"/>
    <circle cx="455" cy="670" r="1.1" opacity=".45"/><circle cx="545" cy="740" r="1.3" opacity=".55"/>
    <circle cx="635" cy="690" r="1" opacity=".4"/><circle cx="725" cy="755" r="1.2" opacity=".5"/>
    <circle cx="815" cy="700" r="1.1" opacity=".45"/><circle cx="905" cy="765" r="1.3" opacity=".55"/>
    <circle cx="995" cy="705" r="1" opacity=".4"/><circle cx="1085" cy="770" r="1.2" opacity=".5"/>
    <circle cx="1175" cy="715" r="1.1" opacity=".45"/><circle cx="1265" cy="780" r="1.3" opacity=".55"/>
    <circle cx="1355" cy="725" r="1" opacity=".4"/><circle cx="1445" cy="790" r="1.2" opacity=".5"/>
    <circle cx="1535" cy="735" r="1.1" opacity=".45"/>
  </g>

  <!-- title -->
  <text class="t title" x="60" y="72">星游记 · 星际航线图</text>
  <text class="t sub" x="62" y="102">RAINBOW SEA　—　从禁飞的地球，到黑洞深处的彩虹海</text>

  <!-- zone dividers + labels -->
  <line x1="790" y1="140" x2="790" y2="890" stroke="#3a4b6e" stroke-width="1" stroke-dasharray="4 10" opacity=".55"/>
  <line x1="1065" y1="140" x2="1065" y2="890" stroke="#5a3a6e" stroke-width="1" stroke-dasharray="4 10" opacity=".55"/>
  <text class="t zone" x="165" y="142">联　盟　区　·　太　阳　系</text>
  <text class="t zone" x="820" y="142">独　立　区</text>
  <text class="t zone" x="1135" y="142">未　知　区</text>

  <!-- faint orbits -->
  <g fill="none" stroke="#1e3a63" stroke-width="1" opacity=".55">
    <ellipse cx="380" cy="470" rx="270" ry="185"/>
    <ellipse cx="380" cy="470" rx="360" ry="250" opacity=".6"/>
    <ellipse cx="380" cy="470" rx="455" ry="320" opacity=".45"/>
  </g>
  <circle cx="60" cy="470" r="90" fill="url(#sun)" opacity=".55"/>
  <text class="t tiny" x="26" y="580">太阳</text>

  <!-- sealed old route -->
  <path d="M325,500 Q430,660 600,660 Q740,660 815,470" fill="none" stroke="#5b6b86" stroke-width="1.6" stroke-dasharray="7 7" opacity=".65"/>
  <text class="t tiny" x="380" y="690">旧航线（已被星际联盟关闭）</text>

  <!-- main route -->
  <path d="M140,470 Q185,392 230,340 Q278,416 325,500 Q378,414 430,335 Q478,420 525,505 Q578,436 630,370 Q725,455 815,390 Q888,428 960,470 Q1060,470 1160,470 Q1272,408 1380,320"
        fill="none" stroke="#ffb703" stroke-width="13" opacity=".12" stroke-linecap="round"/>
  <path d="M140,470 Q185,392 230,340 Q278,416 325,500 Q378,414 430,335 Q478,420 525,505 Q578,436 630,370 Q725,455 815,390 Q888,428 960,470 Q1060,470 1160,470 Q1272,408 1380,320"
        fill="none" stroke="#ffd166" stroke-width="2.6" stroke-linecap="round" filter="url(#soft)"/>

  <!-- 1 Earth -->
  <g>
    <circle cx="140" cy="470" r="40" fill="#2f8fd6" opacity=".12"/>
    <circle cx="140" cy="470" r="26" fill="url(#earth)" filter="url(#soft)"/>
    <path d="M122,458 q14,-10 30,0 q10,8 2,16 q-16,10 -30,-2 q-8,-8 -2,-14 z" fill="#3fa66a" opacity=".55"/>
    <text class="t node" x="140" y="528" text-anchor="middle">① 地球</text>
    <text class="t sub2" x="140" y="548" text-anchor="middle">老城区 · 宇宙大饭店 · 飞船坟场</text>
    <text class="t warn" x="140" y="568" text-anchor="middle">银河眼禁飞令</text>
    <circle cx="140" cy="470" r="34" fill="none" stroke="#ff4d6d" stroke-width="1.4" stroke-dasharray="5 5" opacity=".8"/>
  </g>

  <!-- 2 Moon -->
  <g>
    <circle cx="230" cy="340" r="12" fill="#cfd6e4"/>
    <circle cx="226" cy="336" r="3" fill="#a9b3c6" opacity=".8"/>
    <circle cx="234" cy="344" r="2" fill="#a9b3c6" opacity=".8"/>
    <text class="t node" x="230" y="306" text-anchor="middle">② 月球</text>
    <text class="t sub2" x="230" y="286" text-anchor="middle">嫦娥 · 月树 · 兔子药</text>
  </g>

  <!-- 3 Mars -->
  <g>
    <circle cx="325" cy="500" r="18" fill="#c1440e" filter="url(#soft)"/>
    <circle cx="319" cy="494" r="5" fill="#7a2a08" opacity=".7"/>
    <circle cx="331" cy="505" r="3.5" fill="#7a2a08" opacity=".6"/>
    <text class="t node" x="325" y="545" text-anchor="middle">③ 火星</text>
    <text class="t sub2" x="325" y="565" text-anchor="middle">塔尔西斯港 · 黄泉湾</text>
  </g>

  <!-- 4 Uranus -->
  <g>
    <ellipse cx="430" cy="335" rx="62" ry="26" fill="none" stroke="#9be7ff" stroke-width="1" stroke-dasharray="3 6" opacity=".5"/>
    <circle cx="430" cy="335" r="20" fill="#69d2e7" filter="url(#soft)" opacity=".95"/>
    <ellipse cx="430" cy="335" rx="30" ry="7" fill="none" stroke="#bff0f7" stroke-width="1.2" opacity=".6" transform="rotate(-18 430 335)"/>
    <text class="t node" x="430" y="300" text-anchor="middle">④ 天王星</text>
    <text class="t sub2" x="430" y="280" text-anchor="middle">星学会遗址 · 乌拉拉</text>
    <text class="t tiny" x="430" y="264" text-anchor="middle">雪原 · 冰雪迷宫</text>
  </g>

  <!-- 5 Titan -->
  <g>
    <circle cx="525" cy="505" r="16" fill="#e0a458" filter="url(#soft)"/>
    <text class="t node" x="525" y="548" text-anchor="middle">⑤ 泰坦星</text>
    <text class="t sub2" x="525" y="568" text-anchor="middle">泰坦水 · 原始森林</text>
  </g>

  <!-- 6 Mars 2 -->
  <g>
    <circle cx="630" cy="370" r="14" fill="#c1440e" filter="url(#soft)"/>
    <text class="t node" x="630" y="336" text-anchor="middle">⑥ 火星 · 罗罗乌隐居地</text>
    <text class="t sub2" x="630" y="318" text-anchor="middle">农田 · 格斗螺旋</text>
  </g>

  <!-- season 1 end marker -->
  <g>
    <text class="t warn" x="640" y="404" text-anchor="middle">第一季终点 · 蔓影术</text>
    <text class="t tiny" x="640" y="422" text-anchor="middle">此后航线为本作自撰</text>
  </g>

  <!-- 8 Mercury gate -->
  <g>
    <circle cx="815" cy="390" r="9" fill="#b9b2a6"/>
    <text class="t node" x="815" y="358" text-anchor="middle">⑦ 水星 · 入口</text>
    <text class="t sub2" x="815" y="341" text-anchor="middle">小行星带</text>
    <g stroke="#ff4d6d" stroke-width="2.4" opacity=".9">
      <line x1="803" y1="378" x2="827" y2="402"/>
      <line x1="827" y1="378" x2="803" y2="402"/>
    </g>
    <text class="t warn" x="815" y="425" text-anchor="middle">封锁点</text>
  </g>

  <!-- 9 Devil's Footprints -->
  <g>
    <circle cx="960" cy="470" r="46" fill="#7b2cbf" opacity=".12"/>
    <g fill="none" stroke="#b47cff" stroke-width="2" opacity=".85">
      <ellipse cx="960" cy="470" rx="34" ry="22" transform="rotate(-14 960 470)"/>
      <ellipse cx="960" cy="470" rx="23" ry="14" transform="rotate(-14 960 470)"/>
      <ellipse cx="960" cy="470" rx="12" ry="7" transform="rotate(-14 960 470)"/>
    </g>
    <circle cx="941" cy="444" r="7" fill="#2a1240" stroke="#b47cff" stroke-width="1.2"/>
    <circle cx="985" cy="492" r="5" fill="#2a1240" stroke="#b47cff" stroke-width="1"/>
    <text class="t node" x="960" y="548" text-anchor="middle">⑧ 魔鬼脚印</text>
    <text class="t sub2" x="960" y="570" text-anchor="middle">天然虫洞　坐标＋船＋驾驶员</text>
  </g>

  <!-- 10 Gora -->
  <g>
    <circle cx="1160" cy="470" r="78" fill="url(#bh)" opacity=".95"/>
    <circle cx="1160" cy="470" r="26" fill="#000"/>
    <ellipse cx="1160" cy="470" rx="58" ry="13" fill="none" stroke="#ffb703" stroke-width="2.4" opacity=".8" transform="rotate(-16 1160 470)"/>
    <text class="t node" x="1160" y="360" text-anchor="middle">⑨ 歌罗星系</text>
    <text class="t sub2" x="1160" y="382" text-anchor="middle">巨型黑洞　吞噬生命、物质与光</text>
  </g>

  <!-- 11 Rainbow Sea -->
  <g>
    <path d="M1300,320 A80,80 0 0 1 1460,320" fill="none" stroke="url(#rainbow)" stroke-width="10" opacity=".9" filter="url(#glow)"/>
    <path d="M1315,320 A65,65 0 0 1 1445,320" fill="none" stroke="url(#rainbow)" stroke-width="6" opacity=".65"/>
    <path d="M1330,320 A50,50 0 0 1 1430,320" fill="none" stroke="url(#rainbow)" stroke-width="4" opacity=".45"/>
    <text class="t node" x="1380" y="372" text-anchor="middle" style="fill:#ffe9a8">⑩ 彩虹海</text>
    <text class="t sub2" x="1380" y="392" text-anchor="middle">黑洞内侧的逆熵区 · 时间倒着走</text>
    <text class="t tiny" x="1380" y="412" text-anchor="middle">“黄金成河”——麦林编的募资广告</text>
  </g>

  <!-- 八极星 (off-route) -->
  <g>
    <circle cx="870" cy="205" r="10" fill="#3f6f5f" stroke="#7ec8a9" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text class="t sub2" x="870" y="183" text-anchor="middle">八极星</text>
    <text class="t tiny" x="870" y="235" text-anchor="middle">八极天修行地</text>
  </g>

  <!-- other known places chips -->
  <text class="t legt" x="560" y="772" style="font-size:13px">其他已知地点（不在主航线上）</text>
  <g>
    <rect x="560" y="790" width="185" height="58" rx="8" fill="#0c1426" stroke="#2b3a58"/>
    <text class="t chip" x="576" y="814">亚亚罗（已毁灭）</text>
    <text class="t chip2" x="576" y="834">咕咚母国 · 空间跳跃装置</text>

    <rect x="760" y="790" width="185" height="58" rx="8" fill="#0c1426" stroke="#2b3a58"/>
    <text class="t chip" x="776" y="814">西亚特星</text>
    <text class="t chip2" x="776" y="834">米龙“击溃”黑旗之地</text>

    <rect x="960" y="790" width="185" height="58" rx="8" fill="#0c1426" stroke="#2b3a58"/>
    <text class="t chip" x="976" y="814">木星</text>
    <text class="t chip2" x="976" y="834">第一季未出现 · 留白</text>

    <rect x="1160" y="790" width="185" height="58" rx="8" fill="#0c1426" stroke="#2b3a58"/>
    <text class="t chip" x="1176" y="814">雪流星</text>
    <text class="t chip2" x="1176" y="834">穿越时间 · 带回遇难者</text>

    <rect x="1360" y="790" width="185" height="58" rx="8" fill="#0c1426" stroke="#2b3a58"/>
    <text class="t chip" x="1376" y="814">米多星</text>
    <text class="t chip2" x="1376" y="834">米龙兄妹故乡（推测）</text>
  </g>

  <!-- legend -->
  <g>
    <rect x="60" y="838" width="470" height="122" rx="10" fill="#0b1224" stroke="#2b3a58" stroke-width="1" opacity=".92"/>
    <text class="t legt" x="82" y="868">图　例</text>
    <line x1="82" y1="892" x2="132" y2="892" stroke="#ffd166" stroke-width="3"/>
    <text class="t leg" x="144" y="897">主角航线（按剧情顺序）</text>
    <line x1="82" y1="916" x2="132" y2="916" stroke="#5b6b86" stroke-width="2" stroke-dasharray="7 6"/>
    <text class="t leg" x="144" y="921">封锁 / 旧航线</text>
    <g stroke="#ff4d6d" stroke-width="2.4">
      <line x1="94" y1="936" x2="120" y2="946"/><line x1="120" y1="936" x2="94" y2="946"/>
    </g>
    <text class="t leg" x="144" y="945">银河眼封锁点</text>
    <ellipse cx="107" cy="945" rx="14" ry="8" fill="none" stroke="#b47cff" stroke-width="2"/>
    <text class="t leg" x="300" y="897">天然虫洞</text>
    <circle cx="315" cy="921" r="8" fill="url(#bh)"/>
    <text class="t leg" x="330" y="926">黑洞 / 传说之地</text>
  </g>

  <text class="t tiny" x="1540" y="968" text-anchor="end">※ 本图按剧情顺序与叙事关系绘制，非真实天体比例／距离。</text>
  <text class="t tiny" x="1540" y="988" text-anchor="end">资料整理：2026-10　｜　正史：第一季 1–26 集（电影版不在本图）</text>
</svg>
